name: Deploy Base Infrastructure

on:
  push:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean
      force_apply:
        description: 'Force terraform apply even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  build-container-layers:
    name: 'Build Container-based Lambda Layers'
    runs-on: ubuntu-latest
    needs: determine-environment
    if: ${{ !github.event.inputs.destroy }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set environment variables
        run: |
          echo "PROJECT_NAME=cosine" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
          
          # Get AWS Account ID from AWS CLI (more reliable than secrets)
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Build Container-based Lambda Layers
        run: |
          cd terraform/modules/container-layers
          chmod +x build-container-layers.sh
          ./build-container-layers.sh

      - name: Upload Lambda Layer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layers-${{ needs.determine-environment.outputs.environment }}
          path: terraform/modules/container-layers/layer-*.zip
          retention-days: 1

  deploy-base-infrastructure:
    name: 'Deploy Base Infrastructure'
    needs: [determine-environment, build-container-layers]
    uses: thriambakg/Cosine-pipelines/.github/workflows/terraform-reusable.yml@master
    with:
      terraform_directory: 'terraform'
      infrastructure_type: 'base'
      environment: ${{ needs.determine-environment.outputs.environment }}
      destroy: ${{ github.event.inputs.destroy == 'true' }}
      force_apply: ${{ github.event.inputs.force_apply == 'true' }}
      base_infra_dependency: false
      has_lambda_layer: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  comment-pr:
    name: 'Comment on PR'
    runs-on: ubuntu-latest
    needs: [determine-environment, build-container-layers, deploy-base-infrastructure]
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment PR with Results
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Base Infrastructure Plan - ${{ needs.determine-environment.outputs.environment }}
            
            The Lambda layer has been built, Terraform plan generated, and security scans completed.
            
            ### Summary:
            - **Environment:** ${{ needs.determine-environment.outputs.environment }}
            - **Infrastructure Type:** Base Infrastructure
            - **Dependencies:** Self-contained (creates backend resources)
            - **Lambda Layers:** Container-built with no size limitations
            
            ### Build Results:
            - **Container Layers:** ✅ Built successfully with no size limits
            - **Strands Agents:** ✅ AWS Strands Agents SDK included
            - **Financial Libraries:** ✅ yfinance, numpy, pandas included
            
            ### Security Scans:
            - **TFLint:** Passed
            - **Security Scans:** Passed  
            
            ### Next Steps:
            - Merge this PR to apply the infrastructure changes
            - Monitor the deployment in the Actions tab
            - Deploy application infrastructure after base is complete`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
