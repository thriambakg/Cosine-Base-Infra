# CI/CD Pipeline for Base Infrastructure
# .github/workflows/deploy-base-infrastructure.yml

name: Deploy Base Infrastructure

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-base-infrastructure.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.4.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: 
          - ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/develop' && 'staging' || 'development')) }}
    
    defaults:
      run:
        working-directory: terraform
    
    outputs:
      tf-plan-exists: ${{ steps.plan.outputs.tf-plan-exists }}
      environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ matrix.environment }}.tfbackend" \
            -upgrade
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ matrix.environment }}" \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -out="${{ matrix.environment }}.tfplan" \
            -detailed-exitcode
          
          # Check if plan file exists and has changes
          if [ -f "${{ matrix.environment }}.tfplan" ]; then
            echo "tf-plan-exists=true" >> $GITHUB_OUTPUT
          else
            echo "tf-plan-exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Terraform Plan
        if: steps.plan.outputs.tf-plan-exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ matrix.environment }}
          path: terraform/${{ matrix.environment }}.tfplan
          retention-days: 7
      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            try {
              const planOutput = execSync('terraform show -no-color ${{ matrix.environment }}.tfplan', {
                cwd: 'terraform',
                encoding: 'utf8',
                maxBuffer: 1024 * 1024 * 10 // 10MB buffer
              });
              
              const comment = `## Terraform Plan - ${{ matrix.environment }}
              
              <details>
              <summary>Show Plan</summary>
              
              \`\`\`terraform
              ${planOutput}
              \`\`\`
              
              </details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error creating plan comment:', error);
            }

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch') &&
      needs.terraform-plan.outputs.tf-plan-exists == 'true'
    
    environment: 
      name: ${{ needs.terraform-plan.outputs.environment }}
      
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-${{ needs.terraform-plan.outputs.environment }}
          path: terraform/
      
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ needs.terraform-plan.outputs.environment }}.tfbackend" \
            -upgrade
      
      - name: Terraform Apply
        if: github.event.inputs.destroy != 'true'
        run: |
          terraform apply \
            -auto-approve \
            "${{ needs.terraform-plan.outputs.environment }}.tfplan"
      
      - name: Terraform Destroy
        if: github.event.inputs.destroy == 'true'
        run: |
          terraform destroy \
            -var="environment=${{ needs.terraform-plan.outputs.environment }}" \
            -var-file="environments/${{ needs.terraform-plan.outputs.environment }}.tfvars" \
            -auto-approve
      
      - name: Output Lambda Layer Info
        if: github.event.inputs.destroy != 'true'
        run: |
          echo "## Deployment Complete - ${{ needs.terraform-plan.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Layer Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer ARN:** $(terraform output -raw lambda_layer_arn)" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer Version:** $(terraform output -raw lambda_layer_version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatible Runtimes:** $(terraform output -raw compatible_runtimes)" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: reports/results.sarif
      
      - name: Upload Checkov results to GitHub Advanced Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results.sarif
