name: Deploy Base Infrastructure

on:
  push:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean
      force_apply:
        description: 'Force terraform apply even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  build-lambda-layer:
    name: 'Build Lambda Layer'
    runs-on: ubuntu-latest
    needs: determine-environment
    if: ${{ !github.event.inputs.destroy }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Lambda Layers
        run: |
          cd terraform/modules/lambda-layer
          chmod +x build-layer.sh
          chmod +x build-all-layers.sh
          
          # Build all layers dynamically
          echo "🔍 Discovering available layers..."
          for req_file in layer-definitions/*-dependencies.txt; do
            if [ -f "$req_file" ]; then
              layer_name=$(basename "$req_file" -dependencies.txt)
              echo "📦 Found layer: $layer_name"
            fi
          done
          
          # Build all layers using the consolidated script
          ./build-all-layers.sh
        env:
          PYTHON_CMD: python3

      - name: Verify Layer Contents
        run: |
          cd terraform/modules/lambda-layer
          
          # Dynamically discover and verify all layers
          echo "🔍 Verifying dynamically discovered layers..."
          layer_count=0
          for req_file in layer-definitions/*-dependencies.txt; do
            if [ -f "$req_file" ]; then
              layer_name=$(basename "$req_file" -dependencies.txt)
              layer_file="layer-${layer_name}.zip"
              
              if [ -f "$layer_file" ]; then
                echo "✅ $layer_file created successfully"
                echo "  Size: $(du -h "$layer_file" | cut -f1)"
                echo "  Contents preview:"
                unzip -l "$layer_file" | head -5
                echo ""
                layer_count=$((layer_count + 1))
              else
                echo "❌ $layer_file missing"
                exit 1
              fi
            fi
          done
          
          echo "✅ Successfully verified $layer_count layers"
          
          # Verify critical files exist in Strands layer (where OpenTelemetry would be)
          if unzip -l layer-strands.zip | grep -q "python/opentelemetry_api-.*/entry_points.txt"; then
            echo "✅ OpenTelemetry entry_points.txt found in Strands layer"
          else
            echo "⚠️  OpenTelemetry entry_points.txt not found in Strands layer (may not be needed)"
          fi
          
          # Verify pydantic_core exists in financial layer
          if unzip -l layer-financial.zip | grep -q "python/pydantic_core/"; then
            echo "✅ pydantic_core found in financial layer"
          else
            echo "⚠️  pydantic_core not found in financial layer (may not be needed)"
          fi

      - name: Upload Lambda Layer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layers-${{ needs.determine-environment.outputs.environment }}
          path: terraform/modules/lambda-layer/layer-*.zip
          retention-days: 1

  deploy-base-infrastructure:
    name: 'Deploy Base Infrastructure'
    needs: [determine-environment, build-lambda-layer]
    uses: thriambakg/Cosine-pipelines/.github/workflows/terraform-reusable.yml@master
    with:
      terraform_directory: 'terraform'
      infrastructure_type: 'base'
      environment: ${{ needs.determine-environment.outputs.environment }}
      destroy: ${{ github.event.inputs.destroy == 'true' }}
      force_apply: ${{ github.event.inputs.force_apply == 'true' }}
      base_infra_dependency: false
      has_lambda_layer: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  comment-pr:
    name: 'Comment on PR'
    runs-on: ubuntu-latest
    needs: [determine-environment, build-lambda-layer, deploy-base-infrastructure]
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment PR with Results
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Base Infrastructure Plan - ${{ needs.determine-environment.outputs.environment }}
            
            The Lambda layer has been built, Terraform plan generated, and security scans completed.
            
            ### Summary:
            - **Environment:** ${{ needs.determine-environment.outputs.environment }}
            - **Infrastructure Type:** Base Infrastructure
            - **Dependencies:** Self-contained (creates backend resources)
            - **Lambda Layer:** Built with Linux-compatible dependencies
            
            ### Build Results:
            - **Lambda Layer:** ✅ Built successfully
            - **OpenTelemetry:** ✅ Entry points configured
            - **Pydantic Core:** ✅ Linux-compatible extensions included
            
            ### Security Scans:
            - **TFLint:** Passed
            - **Security Scans:** Passed  
            
            ### Next Steps:
            - Merge this PR to apply the infrastructure changes
            - Monitor the deployment in the Actions tab
            - Deploy application infrastructure after base is complete`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
