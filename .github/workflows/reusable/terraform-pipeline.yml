# Reusable Terraform CI/CD Workflow
# .github/workflows/reusable/terraform-pipeline.yml

name: Reusable Terraform Pipeline

on:
  workflow_call:
    inputs:
      terraform_directory:
        description: 'Directory containing Terraform files (relative to repo root)'
        required: false
        default: 'terraform'
        type: string
      infrastructure_type:
        description: 'Type of infrastructure (base-infra or application)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      destroy:
        description: 'Whether to destroy infrastructure'
        required: false
        default: false
        type: boolean
      base_infra_dependency:
        description: 'Whether this requires base infrastructure to be deployed first'
        required: false
        default: false
        type: boolean
    
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  TF_VERSION: '1.4.0'
  AWS_REGION: 'us-east-1'
  TFLINT_VERSION: '0.46.1'
  TFSEC_VERSION: '1.28.1'

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ inputs.terraform_directory }}
    
    outputs:
      tf-plan-exists: ${{ steps.plan.outputs.tf-plan-exists }}
      plan-summary: ${{ steps.plan.outputs.plan-summary }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      
      - name: Check Base Infrastructure Dependencies
        if: inputs.base_infra_dependency == true
        run: |
          echo "🔍 Checking base infrastructure dependencies..."
          
          BASE_INFRA_BUCKET="cosine-terraform-state-bucket"
          BASE_INFRA_KEY="base-infra/${{ inputs.environment }}/terraform.tfstate"
          
          if aws s3api head-object --bucket "$BASE_INFRA_BUCKET" --key "$BASE_INFRA_KEY" 2>/dev/null; then
            echo "✅ Base infrastructure state found for ${{ inputs.environment }}"
          else
            echo "❌ Base infrastructure not deployed for ${{ inputs.environment }}"
            echo "Please deploy base infrastructure first:"
            echo "  Repository: Cosine-Base-Infra"
            echo "  Environment: ${{ inputs.environment }}"
            exit 1
          fi
      
      - name: Bootstrap Backend Infrastructure (if needed)
        run: |
          echo "🚀 Checking if backend infrastructure exists..."
          
          if aws s3api head-bucket --bucket cosine-terraform-state-bucket 2>/dev/null; then
            echo "✅ Backend infrastructure already exists"
          else
            if [ -d "bootstrap" ]; then
              echo "📦 Creating backend infrastructure..."
              cd bootstrap
              terraform init
              terraform plan
              terraform apply -auto-approve
              cd ..
              echo "✅ Backend infrastructure created successfully"
            else
              echo "❌ Backend infrastructure does not exist and no bootstrap directory found"
              echo "Please ensure backend infrastructure is deployed"
              exit 1
            fi
          fi
      
      - name: Terraform Init
        run: |
          # Initialize with environment-specific backend config
          if [ -f "backend-configs/${{ inputs.environment }}.tfbackend" ]; then
            echo "🔧 Using backend config file: backend-configs/${{ inputs.environment }}.tfbackend"
            terraform init \
              -backend-config="backend-configs/${{ inputs.environment }}.tfbackend" \
              -upgrade
          else
            # Fallback to dynamic backend configuration
            echo "🔧 Using dynamic backend configuration"
            terraform init \
              -backend-config="key=${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" \
              -upgrade
          fi
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Install Security Tools
        run: |
          # Install TFLint
          curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          unzip tflint.zip -d /usr/local/bin/
          tflint --version
          
          # Install tfsec
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
          chmod +x tfsec
          mv tfsec /usr/local/bin/
          tfsec --version
      
      - name: TFLint
        run: |
          tflint --init
          tflint
      
      - name: tfsec Security Scan
        run: |
          tfsec . --format=json --out=tfsec-results.json || true
          tfsec . --format=sarif --out=tfsec-results.sarif || true
          tfsec .
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ inputs.terraform_directory }}/
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: reports/checkov-results.sarif
      
      - name: Upload Security Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.terraform_directory }}/tfsec-results.sarif
        continue-on-error: true
      
      - name: Upload Checkov Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-results.sarif
        continue-on-error: true
      
      - name: Handle Existing Resources
        if: inputs.infrastructure_type == 'application'
        run: |
          echo "🔍 Checking for existing AWS resources..."
          
          # Function to check and import S3 bucket
          check_and_import_bucket() {
            local bucket_name="$1"
            local resource_name="$2"
            
            echo "Checking bucket: $bucket_name"
            if aws s3api head-bucket --bucket "$bucket_name" 2>/dev/null; then
              echo "✅ Bucket $bucket_name exists"
              if ! terraform state show "$resource_name" 2>/dev/null; then
                echo "📦 Importing bucket $bucket_name into Terraform state..."
                terraform import "$resource_name" "$bucket_name" || echo "⚠️ Import failed, resource may not exist in current configuration"
              else
                echo "✅ Bucket $bucket_name already managed by Terraform"
              fi
            else
              echo "ℹ️ Bucket $bucket_name does not exist - will be created"
            fi
          }
          
          echo "🎯 Resource check completed!"
      
      - name: Terraform Plan
        id: plan
        run: |
          echo "🔍 Planning infrastructure changes..."
          
          # Determine which variable files to use
          PLAN_ARGS="-var=environment=${{ inputs.environment }}"
          
          if [ -f "terraform.auto.tfvars" ]; then
            echo "✅ Using terraform.auto.tfvars for variables"
          elif [ -f "environments/${{ inputs.environment }}.tfvars" ]; then
            echo "✅ Using environment-specific tfvars file"
            PLAN_ARGS="$PLAN_ARGS -var-file=environments/${{ inputs.environment }}.tfvars"
          else
            echo "⚠️ No variable files found, using defaults"
          fi
          
          # Execute plan
          terraform plan $PLAN_ARGS -out="${{ inputs.environment }}.tfplan" -detailed-exitcode
          
          # Check if plan file exists and has changes
          if [ -f "${{ inputs.environment }}.tfplan" ]; then
            echo "tf-plan-exists=true" >> $GITHUB_OUTPUT
            
            # Generate plan summary
            PLAN_SUMMARY=$(terraform show -no-color ${{ inputs.environment }}.tfplan | head -50)
            echo "plan-summary<<EOF" >> $GITHUB_OUTPUT
            echo "$PLAN_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tf-plan-exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Terraform Plan
        if: steps.plan.outputs.tf-plan-exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ inputs.infrastructure_type }}-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/${{ inputs.environment }}.tfplan
          retention-days: 7

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: needs.terraform-plan.outputs.tf-plan-exists == 'true'
    
    environment: 
      name: ${{ inputs.environment }}
      
    defaults:
      run:
        working-directory: ${{ inputs.terraform_directory }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-${{ inputs.infrastructure_type }}-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/
      
      - name: Terraform Init
        run: |
          # Initialize with same backend config as plan step
          if [ -f "backend-configs/${{ inputs.environment }}.tfbackend" ]; then
            terraform init \
              -backend-config="backend-configs/${{ inputs.environment }}.tfbackend" \
              -upgrade
          else
            terraform init \
              -backend-config="key=${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" \
              -upgrade
          fi
      
      - name: Terraform Apply
        if: inputs.destroy != true
        run: |
          terraform apply \
            -auto-approve \
            "${{ inputs.environment }}.tfplan"
      
      - name: Terraform Destroy
        if: inputs.destroy == true
        run: |
          # Determine which variable files to use for destroy
          DESTROY_ARGS="-var=environment=${{ inputs.environment }}"
          
          if [ -f "terraform.auto.tfvars" ]; then
            echo "✅ Using terraform.auto.tfvars for destroy"
          elif [ -f "environments/${{ inputs.environment }}.tfvars" ]; then
            echo "✅ Using environment-specific tfvars file for destroy"
            DESTROY_ARGS="$DESTROY_ARGS -var-file=environments/${{ inputs.environment }}.tfvars"
          fi
          
          terraform destroy $DESTROY_ARGS -auto-approve
      
      - name: Generate Deployment Summary
        if: inputs.destroy != true
        run: |
          echo "## 🚀 Deployment Complete - ${{ inputs.infrastructure_type }} (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Infrastructure-specific outputs
          if [ "${{ inputs.infrastructure_type }}" == "base" ]; then
            echo "### 🏗️ Base Infrastructure Deployed:" >> $GITHUB_STEP_SUMMARY
            
            # VPC Information
            if terraform output vpc_id > /dev/null 2>&1; then
              echo "- **VPC ID:** $(terraform output -raw vpc_id)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Subnet Information
            if terraform output private_subnet_ids > /dev/null 2>&1; then
              echo "- **Private Subnet IDs:** $(terraform output -raw private_subnet_ids)" >> $GITHUB_STEP_SUMMARY
            fi
            
            if terraform output public_subnet_ids > /dev/null 2>&1; then
              echo "- **Public Subnet IDs:** $(terraform output -raw public_subnet_ids)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Lambda Layer Info
            if terraform output lambda_layer_arn > /dev/null 2>&1; then
              echo "- **Lambda Layer ARN:** $(terraform output -raw lambda_layer_arn)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Database endpoints
            if terraform output database_endpoint > /dev/null 2>&1; then
              echo "- **Database Endpoint:** $(terraform output -raw database_endpoint)" >> $GITHUB_STEP_SUMMARY
            fi
            
          elif [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "### 🖥️ Application Infrastructure Deployed:" >> $GITHUB_STEP_SUMMARY
            
            # Frontend URL
            if terraform output frontend_url > /dev/null 2>&1; then
              echo "- **Frontend URL:** $(terraform output -raw frontend_url)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # API Gateway
            if terraform output api_gateway_url > /dev/null 2>&1; then
              echo "- **API Gateway URL:** $(terraform output -raw api_gateway_url)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # CloudFront
            if terraform output cloudfront_distribution_id > /dev/null 2>&1; then
              echo "- **CloudFront Distribution ID:** $(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 State Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Resources Managed:** $(terraform state list | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **State Location:** ${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" >> $GITHUB_STEP_SUMMARY
      
      - name: Generate Destroy Summary
        if: inputs.destroy == true
        run: |
          echo "## 🧹 Destroy Complete - ${{ inputs.infrastructure_type }} (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Infrastructure Destroyed:" >> $GITHUB_STEP_SUMMARY
          echo "- All ${{ inputs.infrastructure_type }} resources have been destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform state has been updated" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "- Base infrastructure remains intact" >> $GITHUB_STEP_SUMMARY
          fi
